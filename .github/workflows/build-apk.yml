name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Web Assets for Capacitor
        run: python prepare_www.py

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android platform with Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Android project..."
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Output Directory
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Teledata-One-v1.3.7.apk
          echo "APK generated successfully:"
          ls -lh dist-apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Teledata-One-v1.3.7-APK
          path: dist-apk/Teledata-One-v1.3.7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.7
          name: "Teledata One v1.3.7 (APK)"
          body: |
            ## 📱 تطبيق لوحة إنذار الحريق Teledata One (أندرويد)
            
            - **الإصدار:** 1.3.7
            - **تاريخ البناء:** ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **الملف المرفق:** `Teledata-One-v1.3.7.apk`
            
            ### تعليمات التثبيت:
            1. قم بتحميل ملف APK المرفق أدناه إلى هاتفك الأندرويد.
            2. افتح الملف وقم بالموافقة على التثبيت (السماح بالتثبيت من مصادر غير معروفة إذا طُلب منك).
            3. يعمل التطبيق بدون إنترنت بالكامل (Offline) ويحتوي على كافة المخططات والصور وجداول الأعطال ومحرك البحث الفوري.
          files: dist-apk/Teledata-One-v1.3.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
